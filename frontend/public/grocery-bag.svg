<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <!-- Background -->
  <rect width="400" height="420" fill="#FFF8F0"/>

  <!-- Hand -->
  <g>
    <!-- Palm -->
    <ellipse cx="230" cy="60" rx="38" ry="22" fill="#FBBF8A" transform="rotate(-20 230 60)"/>
    <!-- Thumb -->
    <ellipse cx="197" cy="52" rx="13" ry="20" fill="#FBBF8A" transform="rotate(-35 197 52)"/>
    <!-- Fingers group -->
    <ellipse cx="218" cy="38" rx="10" ry="22" fill="#FBBF8A" transform="rotate(-10 218 38)"/>
    <ellipse cx="236" cy="33" rx="10" ry="23" fill="#FBBF8A" transform="rotate(5 236 33)"/>
    <ellipse cx="254" cy="37" rx="10" ry="21" fill="#FBBF8A" transform="rotate(15 254 37)"/>
    <ellipse cx="268" cy="46" rx="10" ry="18" fill="#FBBF8A" transform="rotate(25 268 46)"/>
    <!-- Wrist -->
    <rect x="215" y="62" width="40" height="50" rx="10" fill="#FBBF8A" transform="rotate(-5 215 62)"/>
  </g>

  <!-- Bag handles -->
  <path d="M155 130 Q140 80 175 75 Q210 70 215 110" stroke="#C8956C" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M245 130 Q260 80 225 75 Q190 70 215 110" stroke="#C8956C" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Bag body -->
  <path d="M120 145 L130 340 Q130 360 150 360 L250 360 Q270 360 270 340 L280 145 Z" fill="#D4A574"/>
  <path d="M120 145 L280 145 Q285 145 285 150 L275 165 L125 165 L115 150 Q115 145 120 145 Z" fill="#C8956C"/>

  <!-- Bag fold lines -->
  <path d="M135 200 Q200 190 265 200" stroke="#BF8A5A" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M133 230 Q200 220 267 230" stroke="#BF8A5A" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Recycle symbol on bag -->
  <g transform="translate(200,290) scale(0.7)" opacity="0.6">
    <path d="M0,-28 L8,-14 L-8,-14 Z" fill="#BF8A5A"/>
    <path d="M24,14 L16,0 L32,0 Z" fill="#BF8A5A" transform="rotate(120)"/>
    <path d="M-24,14 L-32,0 L-16,0 Z" fill="#BF8A5A" transform="rotate(240)"/>
    <path d="M0,-20 Q20,-10 20,14" stroke="#BF8A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M20,14 Q0,28 -20,14" stroke="#BF8A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-20,14 Q-20,-10 0,-20" stroke="#BF8A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Carrot (sticking out top) -->
  <g transform="translate(162, 118) rotate(-25)">
    <path d="M8 0 Q12 30 8 55 Q4 30 8 0Z" fill="#F97316"/>
    <path d="M8 0 Q0 -15 -5 -8 Q2 -5 8 0Z" fill="#16A34A"/>
    <path d="M8 0 Q16 -12 20 -5 Q14 -3 8 0Z" fill="#16A34A"/>
    <path d="M8 0 Q8 -18 4 -12 Q6 -5 8 0Z" fill="#16A34A"/>
  </g>

  <!-- Lettuce/cabbage -->
  <g transform="translate(195, 110)">
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#4ADE80"/>
    <ellipse cx="-8" cy="-5" rx="14" ry="11" fill="#22C55E"/>
    <ellipse cx="8" cy="-6" rx="13" ry="10" fill="#16A34A"/>
    <ellipse cx="0" cy="-8" rx="10" ry="8" fill="#4ADE80"/>
  </g>

  <!-- Eggplant -->
  <g transform="translate(238, 115) rotate(20)">
    <ellipse cx="0" cy="12" rx="12" ry="22" fill="#7C3AED"/>
    <path d="M-4 -5 Q0 -18 4 -5" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-4" rx="7" ry="5" fill="#16A34A"/>
  </g>

  <!-- Baguette/bread stick -->
  <g transform="translate(258, 108) rotate(30)">
    <rect x="-6" y="-35" width="12" height="55" rx="6" fill="#D97706"/>
    <path d="M-3 -25 Q0 -28 3 -25" stroke="#92400E" stroke-width="2" fill="none"/>
    <path d="M-3 -10 Q0 -13 3 -10" stroke="#92400E" stroke-width="2" fill="none"/>
    <path d="M-3 5 Q0 2 3 5" stroke="#92400E" stroke-width="2" fill="none"/>
  </g>

  <!-- Herb/leaf (left) -->
  <g transform="translate(140, 120) rotate(-40)">
    <path d="M0 0 Q-10 -20 0 -35 Q10 -20 0 0Z" fill="#16A34A"/>
    <path d="M0 0 Q-8 -15 0 -35" stroke="#15803D" stroke-width="1.5" fill="none"/>
  </g>
</svg>
